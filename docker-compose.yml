services:
  postgres:
    image: postgres:16-alpine
    container_name: bgp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bundle_game_platform
    ports:
      - "5432:5432"
    volumes:
      - bgp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bgp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bgp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bgp-postgres-data:
  bgp-redis-data:
